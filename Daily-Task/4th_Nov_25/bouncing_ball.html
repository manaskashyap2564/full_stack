<!DOCTYPE html>
<html>
<head>
  <title>Bouncing Ball Animation</title>
  <style>
    #ball {
      width: 50px;
      height: 50px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      left: 0;
      top: 0;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
    }
  </style>
</head>
<body>
  <div id="ball"></div>
  <div id="controls">
    <button onclick="startBall()">Start</button>
    <button onclick="stopBall()">Stop</button>
  </div>
  <script>
    const ball = document.getElementById("ball");
    let x = 0, y = 0;
    let xSpeed = 4, ySpeed = 4;
    let animationId = null;

    function animate() {
      x += xSpeed;
      y += ySpeed;

      if (x + 50 > window.innerWidth || x < 0) xSpeed = -xSpeed;
      if (y + 50 > window.innerHeight || y < 0) ySpeed = -ySpeed;

      ball.style.left = x + "px";
      ball.style.top = y + "px";
      animationId = requestAnimationFrame(animate);
    }

    function startBall() {
      if (!animationId) animate();
    }

    function stopBall() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }
  </script>
</body>
</html>
