<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Cryptocurrency Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .update-info {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls select {
            padding: 10px 20px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background: white;
            transition: border-color 0.3s;
        }

        .controls select:focus {
            outline: none;
            border-color: #2a5298;
        }

        .controls button {
            padding: 10px 25px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .controls button:hover {
            transform: translateY(-2px);
        }

        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .crypto-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .crypto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .crypto-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
        }

        .crypto-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .crypto-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .crypto-info h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 5px;
        }

        .crypto-info p {
            color: #6c757d;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .crypto-price {
            font-size: 2.5em;
            font-weight: bold;
            margin: 15px 0;
            color: #333;
        }

        .crypto-change {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .crypto-change.up {
            background: #d4edda;
            color: #28a745;
        }

        .crypto-change.down {
            background: #f8d7da;
            color: #dc3545;
        }

        .crypto-details {
            border-top: 1px solid #e9ecef;
            padding-top: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #6c757d;
        }

        .detail-row span:last-child {
            font-weight: bold;
            color: #333;
        }

        .chart-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .chart-section h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: white;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2a5298;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .crypto-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .controls {
                flex-direction: column;
            }

            .controls select,
            .controls button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 Real-Time Crypto Tracker</h1>
            <p>Live cryptocurrency prices and market data</p>
        </div>

        <div class="update-info">
            <div class="live-indicator"></div>
            <span id="updateTime">Loading...</span>
        </div>

        <div class="controls">
            <select id="currencySelect">
                <option value="usd">USD ($)</option>
                <option value="eur">EUR (€)</option>
                <option value="gbp">GBP (£)</option>
                <option value="inr">INR (₹)</option>
                <option value="jpy">JPY (¥)</option>
            </select>

            <select id="updateInterval">
                <option value="5000">Update every 5 seconds</option>
                <option value="10000">Update every 10 seconds</option>
                <option value="30000">Update every 30 seconds</option>
                <option value="60000">Update every 1 minute</option>
            </select>

            <button id="refreshBtn">🔄 Refresh Now</button>
            <button id="toggleAutoUpdate">⏸️ Pause Updates</button>
        </div>

        <div id="errorContainer"></div>

        <div class="crypto-grid" id="cryptoGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading cryptocurrency data...</p>
            </div>
        </div>

        <div class="chart-section">
            <h2>Price Comparison Chart</h2>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        class CryptoTracker {
            constructor() {
                this.cryptoIds = ['bitcoin', 'ethereum', 'binancecoin', 'cardano', 'solana', 'polkadot'];
                this.currency = 'usd';
                this.updateInterval = 5000;
                this.intervalId = null;
                this.isAutoUpdateEnabled = true;
                this.chart = null;
                this.priceHistory = {};
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.fetchCryptoData();
                this.startAutoUpdate();
            }

            setupEventListeners() {
                document.getElementById('currencySelect').addEventListener('change', (e) => {
                    this.currency = e.target.value;
                    this.fetchCryptoData();
                });

                document.getElementById('updateInterval').addEventListener('change', (e) => {
                    this.updateInterval = parseInt(e.target.value);
                    if (this.isAutoUpdateEnabled) {
                        this.startAutoUpdate();
                    }
                });

                document.getElementById('refreshBtn').addEventListener('click', () => {
                    this.fetchCryptoData();
                });

                document.getElementById('toggleAutoUpdate').addEventListener('click', () => {
                    this.toggleAutoUpdate();
                });
            }

            async fetchCryptoData() {
                try {
                    this.showLoading();
                    this.hideError();

                    const url = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=${this.currency}&ids=${this.cryptoIds.join(',')}&order=market_cap_desc&sparkline=false&price_change_percentage=24h`;
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    this.updatePriceHistory(data);
                    this.renderCryptoCards(data);
                    this.updateChart(data);
                    this.updateTimestamp();

                } catch (error) {
                    console.error('Error fetching crypto data:', error);
                    this.showError('Failed to fetch cryptocurrency data. Please try again.');
                }
            }

            updatePriceHistory(data) {
                data.forEach(crypto => {
                    if (!this.priceHistory[crypto.id]) {
                        this.priceHistory[crypto.id] = [];
                    }
                    this.priceHistory[crypto.id].push({
                        price: crypto.current_price,
                        timestamp: Date.now()
                    });

                    // Keep only last 20 data points
                    if (this.priceHistory[crypto.id].length > 20) {
                        this.priceHistory[crypto.id].shift();
                    }
                });
            }

            renderCryptoCards(data) {
                const grid = document.getElementById('cryptoGrid');
                
                grid.innerHTML = data.map(crypto => {
                    const priceChange = crypto.price_change_percentage_24h;
                    const isPositive = priceChange >= 0;
                    const changeClass = isPositive ? 'up' : 'down';
                    const changeSymbol = isPositive ? '▲' : '▼';
                    
                    return `
                        <div class="crypto-card">
                            <div class="crypto-header">
                                <img src="${crypto.image}" alt="${crypto.name}" class="crypto-icon">
                                <div class="crypto-info">
                                    <h2>${crypto.name}</h2>
                                    <p>${crypto.symbol.toUpperCase()}</p>
                                </div>
                            </div>
                            
                            <div class="crypto-price">
                                ${this.formatPrice(crypto.current_price)}
                            </div>
                            
                            <div class="crypto-change ${changeClass}">
                                ${changeSymbol} ${Math.abs(priceChange).toFixed(2)}%
                            </div>
                            
                            <div class="crypto-details">
                                <div class="detail-row">
                                    <span>Market Cap:</span>
                                    <span>${this.formatLargeNumber(crypto.market_cap)}</span>
                                </div>
                                <div class="detail-row">
                                    <span>24h Volume:</span>
                                    <span>${this.formatLargeNumber(crypto.total_volume)}</span>
                                </div>
                                <div class="detail-row">
                                    <span>24h High:</span>
                                    <span>${this.formatPrice(crypto.high_24h)}</span>
                                </div>
                                <div class="detail-row">
                                    <span>24h Low:</span>
                                    <span>${this.formatPrice(crypto.low_24h)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            updateChart(data) {
                const canvas = document.getElementById('priceChart');
                const ctx = canvas.getContext('2d');

                const labels = data.map(crypto => crypto.name);
                const prices = data.map(crypto => crypto.current_price);
                const changes = data.map(crypto => crypto.price_change_percentage_24h);

                // Create background colors based on price change
                const backgroundColors = changes.map(change => 
                    change >= 0 ? 'rgba(40, 167, 69, 0.6)' : 'rgba(220, 53, 69, 0.6)'
                );

                const borderColors = changes.map(change => 
                    change >= 0 ? 'rgba(40, 167, 69, 1)' : 'rgba(220, 53, 69, 1)'
                );

                if (this.chart) {
                    this.chart.destroy();
                }

                this.chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: `Price (${this.currency.toUpperCase()})`,
                            data: prices,
                            backgroundColor: backgroundColors,
                            borderColor: borderColors,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: false,
                                ticks: {
                                    callback: (value) => this.formatPrice(value)
                                }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: (context) => {
                                        const index = context.dataIndex;
                                        const price = this.formatPrice(context.parsed.y);
                                        const change = changes[index].toFixed(2);
                                        const changeSymbol = change >= 0 ? '▲' : '▼';
                                        return [
                                            `Price: ${price}`,
                                            `24h Change: ${changeSymbol} ${Math.abs(change)}%`
                                        ];
                                    }
                                }
                            }
                        }
                    }
                });
            }

            formatPrice(price) {
                const symbols = {
                    usd: '$',
                    eur: '€',
                    gbp: '£',
                    inr: '₹',
                    jpy: '¥'
                };

                const symbol = symbols[this.currency] || '$';
                
                if (price < 1) {
                    return `${symbol}${price.toFixed(6)}`;
                } else if (price < 100) {
                    return `${symbol}${price.toFixed(2)}`;
                } else {
                    return `${symbol}${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                }
            }

            formatLargeNumber(num) {
                const symbols = {
                    usd: '$',
                    eur: '€',
                    gbp: '£',
                    inr: '₹',
                    jpy: '¥'
                };

                const symbol = symbols[this.currency] || '$';

                if (num >= 1e12) {
                    return `${symbol}${(num / 1e12).toFixed(2)}T`;
                } else if (num >= 1e9) {
                    return `${symbol}${(num / 1e9).toFixed(2)}B`;
                } else if (num >= 1e6) {
                    return `${symbol}${(num / 1e6).toFixed(2)}M`;
                } else {
                    return `${symbol}${num.toLocaleString('en-US')}`;
                }
            }

            updateTimestamp() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
                document.getElementById('updateTime').textContent = `Last updated: ${timeString}`;
            }

            startAutoUpdate() {
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                }

                if (this.isAutoUpdateEnabled) {
                    this.intervalId = setInterval(() => {
                        this.fetchCryptoData();
                    }, this.updateInterval);
                }
            }

            toggleAutoUpdate() {
                this.isAutoUpdateEnabled = !this.isAutoUpdateEnabled;
                const button = document.getElementById('toggleAutoUpdate');
                
                if (this.isAutoUpdateEnabled) {
                    button.textContent = '⏸️ Pause Updates';
                    this.startAutoUpdate();
                } else {
                    button.textContent = '▶️ Resume Updates';
                    clearInterval(this.intervalId);
                }
            }

            showLoading() {
                // Only show loading on first load
                if (document.getElementById('cryptoGrid').children.length === 1 && 
                    document.getElementById('cryptoGrid').querySelector('.loading')) {
                    // Already showing loading
                }
            }

            showError(message) {
                const errorContainer = document.getElementById('errorContainer');
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${message}
                    </div>
                `;
            }

            hideError() {
                document.getElementById('errorContainer').innerHTML = '';
            }
        }

        // Initialize the tracker
        const tracker = new CryptoTracker();
    </script>
</body>
</html>
