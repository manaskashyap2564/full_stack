<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 18: Async Data Fetching</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        h1 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 30px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-timeout {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-promise {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .btn-async {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        .status.loading {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        .data-display {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #dee2e6;
            min-height: 150px;
        }
        .user-card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .user-card h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .user-card p {
            margin: 5px 0;
            color: #666;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏳ Async Data Fetching Demo</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            Simulate server responses with setTimeout() and Promises
        </p>

        <div class="button-group">
            <button class="btn-timeout" onclick="fetchWithTimeout()">
                setTimeout()
            </button>
            <button class="btn-promise" onclick="fetchWithPromise()">
                Promise
            </button>
            <button class="btn-async" onclick="fetchWithAsync()">
                Async/Await
            </button>
        </div>

        <div id="status"></div>
        <div id="dataDisplay" class="data-display">
            <p style="text-align: center; color: #999;">Click a button to fetch data</p>
        </div>
    </div>

    <script>

        const dataDisplay = document.getElementById('dataDisplay');

            { id: 3, name: 'Bob Johnson', email: 'bob@example.com', role: 'Manager' }

        function showLoading() {
            statusDiv.className = 'status loading';
            statusDiv.innerHTML = '⏳ Loading data... <div class="spinner"></div>';
            dataDisplay.innerHTML = '';

        function showSuccess() {
            statusDiv.className = 'status success';
            statusDiv.textContent = '✅ Data loaded successfully!';
        }

        function showError(message) {
            statusDiv.className = 'status error';
            statusDiv.textContent = `❌ Error: ${message}`;
        }

        function displayUsers(users) {
            dataDisplay.innerHTML = users.map(user => `
                <div class="user-card">
                    <h3>${user.name}</h3>
                    <p>📧 ${user.email}</p>
                    <p>👤 ${user.role}</p>
                </div>
            `).join('');
        }

                statusDiv.textContent = '🔨 Implement this using setTimeout()';

            //             resolve(mockUsers);

            //             reject('Failed to fetch data');
            //         }
            //     }, 2000);
            // });

            //     .then(users => {
            //         showSuccess();
            //         displayUsers(users);
            //     })
            //     .catch(error => {
            //         showError(error);
            //     });

            setTimeout(() => {
                statusDiv.className = 'status error';
                statusDiv.textContent = '🔨 Implement this using Promise';
            }, 500);
        }

        // TODO: Implement using async/await
        async function fetchWithAsync() {
            showLoading();

            //     const users = await simulateFetch();
            //     showSuccess();
            //     displayUsers(users);
            // } catch (error) {
            //     showError(error);
            // }

            setTimeout(() => {
                statusDiv.className = 'status error';
                statusDiv.textContent = '🔨 Implement this using async/await';
            }, 500);
        }

        // Helper function for async/await
        function simulateFetch() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    const success = Math.random() > 0.2;
                    if (success) {
                        resolve(mockUsers);
                    } else {
                        reject('Network error');
                    }
                }, 2000);
            });
        }
    </script>
</body>
</html>
