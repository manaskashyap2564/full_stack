<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 23: Dynamic Chessboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            padding: 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 800px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label {
            font-weight: bold;
            color: #555;
        }
        input[type="number"] {
            width: 60px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .chessboard-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        #chessboard {
            display: inline-grid;
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .square:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .square.selected {
            border: 3px solid #f39c12;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.6);
        }
        .coordinate {
            position: absolute;
            font-size: 10px;
            color: rgba(0,0,0,0.3);
            font-weight: bold;
        }
        .info-panel {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }
        .info-panel h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .info-text {
            color: #666;
            font-size: 14px;
        }
        .theme-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .theme-btn {
            padding: 8px 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>♟️ Dynamic Chessboard Generator</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="boardSize">Board Size:</label>
                <input type="number" id="boardSize" value="8" min="4" max="16">
            </div>
            <div class="control-group">
                <label for="squareSize">Square Size:</label>
                <input type="number" id="squareSize" value="60" min="30" max="100">
            </div>
            <button onclick="generateChessboard()">Generate Board</button>
        </div>

        <div class="theme-buttons">
            <button class="theme-btn" onclick="applyTheme('classic')">Classic Theme</button>
            <button class="theme-btn" onclick="applyTheme('blue')">Blue Theme</button>
            <button class="theme-btn" onclick="applyTheme('green')">Green Theme</button>
            <button class="theme-btn" onclick="applyTheme('purple')">Purple Theme</button>
        </div>

        <div class="chessboard-container">
            <div id="chessboard"></div>
        </div>

        <div class="info-panel">
            <h3>Instructions</h3>
            <div class="info-text">
                <p>🎯 Adjust the board size and square size, then click "Generate Board"</p>
                <p>🎨 Try different color themes</p>
                <p>🖱️ Click on any square to select it</p>
                <p id="selectedSquare">No square selected</p>
            </div>
        </div>
    </div>

    <script>
        const themes = {
            classic: { light: '#f0d9b5', dark: '#b58863' },
            blue: { light: '#e0f2f7', dark: '#4a90a4' },
            green: { light: '#eeeed2', dark: '#769656' },
            purple: { light: '#e8d5f2', dark: '#9b59b6' }
        };

        let currentTheme = 'classic';

        function generateChessboard() {
            // TODO: Generate chessboard using nested loops
            const size = parseInt(document.getElementById('boardSize').value);
            const squareSize = parseInt(document.getElementById('squareSize').value);
            const board = document.getElementById('chessboard');
            
            // Clear existing board
            board.innerHTML = '';
            
            // Set grid template
            board.style.gridTemplateColumns = `repeat(${size}, ${squareSize}px)`;
            board.style.gridTemplateRows = `repeat(${size}, ${squareSize}px)`;

            // TODO: Use nested loops to create squares
            // Outer loop: rows (i from 0 to size-1)
            // Inner loop: columns (j from 0 to size-1)
            // Determine color: (i + j) % 2 === 0 ? light : dark
            
            // Example implementation:
            // for (let i = 0; i < size; i++) {
            //     for (let j = 0; j < size; j++) {
            //         const square = document.createElement('div');
            //         square.className = 'square';
            //         
            //         // Apply alternating colors
            //         const isLight = (i + j) % 2 === 0;
            //         square.style.backgroundColor = isLight ? themes[currentTheme].light : themes[currentTheme].dark;
            //         square.style.width = squareSize + 'px';
            //         square.style.height = squareSize + 'px';
            //         
            //         // Add coordinate
            //         const coord = document.createElement('span');
            //         coord.className = 'coordinate';
            //         coord.textContent = `${String.fromCharCode(65 + j)}${size - i}`;
            //         square.appendChild(coord);
            //         
            //         // Add click event
            //         square.onclick = () => selectSquare(square, i, j);
            //         
            //         board.appendChild(square);
            //     }
            // }

            // Placeholder
            board.innerHTML = '<p style="text-align: center; padding: 40px; color: #999;">🔨 Implement chessboard generation using loops</p>';
        }

        function selectSquare(square, row, col) {
            // TODO: Remove previous selection
            document.querySelectorAll('.square').forEach(s => s.classList.remove('selected'));
            
            // Add selection to clicked square
            square.classList.add('selected');
            
            // Update info
            const size = parseInt(document.getElementById('boardSize').value);
            const file = String.fromCharCode(65 + col);
            const rank = size - row;
            document.getElementById('selectedSquare').textContent = 
                `Selected: ${file}${rank} (Row: ${row + 1}, Col: ${col + 1})`;
        }

        function applyTheme(themeName) {
            currentTheme = themeName;
            
            // TODO: Reapply colors to all squares using the new theme
            const squares = document.querySelectorAll('.square');
            squares.forEach((square, index) => {
                const size = parseInt(document.getElementById('boardSize').value);
                const row = Math.floor(index / size);
                const col = index % size;
                const isLight = (row + col) % 2 === 0;
                
                // Apply theme colors dynamically using .style.backgroundColor
                square.style.backgroundColor = isLight ? 
                    themes[themeName].light : 
                    themes[themeName].dark;
            });
        }

        // Generate initial board
        generateChessboard();
    </script>
</body>
</html>
